name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "CoD Asset Porter" --icon icon.ico --add-data "icon.ico;."
          --collect-all tkinterdnd2 app.py
      - name: Smoke test the exe's command line
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import test_porter, os; os.makedirs('smoke', exist_ok=True); test_porter.make_samples('smoke')"
          $p = Start-Process -FilePath "dist\CoD Asset Porter.exe" -ArgumentList "--game","waw","--out","smoke_out","smoke" -Wait -PassThru -NoNewWindow
          if (-not (Test-Path "smoke_out\source_data")) { throw "exe produced no output" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\CoD Asset Porter.exe" release\
          Copy-Item README.md, LICENSE release\
          Compress-Archive -Path release\* -DestinationPath "CoD-Asset-Porter-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CoD-Asset-Porter-windows
          path: CoD-Asset-Porter-windows.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CoD-Asset-Porter-windows.zip
          generate_release_notes: true
